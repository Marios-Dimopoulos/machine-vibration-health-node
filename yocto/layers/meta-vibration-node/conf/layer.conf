# This layer has a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# This layer has recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-vibration-node"
BBFILE_PATTERN_meta-vibration-node = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-vibration-node = "6"

LAYERDEPENDS_meta-vibration-node = "core"
LAYERSERIES_COMPAT_meta-vibration-node = "scarthgap"
