# Drivers for hardware the vibration node does not use. The DK board declares it in its device tree,
# so these drivers were loaded and probed at every boot (seen with lsmod).
# A whole menu switched off removes every driver under it.

# Camera: IMX335 sensor, DCMIPP, CSI and the whole video (V4L2) framework
# CONFIG_MEDIA_SUPPORT is not set

# Display: DRM, display controller, panel. Touchscreen on the display connector.
# CONFIG_DRM is not set
# CONFIG_INPUT_TOUCHSCREEN is not set
# The panel's backlight driver has its own menu (not under DRM); its device also made
# systemd run systemd-backlight@ at every boot.
# CONFIG_BACKLIGHT_GPIO is not set
# The framebuffer: the old way of drawing on a screen. There is no screen.
# (CONFIG_VT, the virtual terminals, cannot be switched off here: it is hidden unless
# CONFIG_EXPERT is set, so Kconfig ignores the line and keeps its default y. getty@tty1 is
# masked in the image recipe instead.)
# CONFIG_FB is not set

# Audio: ALSA/ASoC, the digital microphones and their filter (MDF)
# CONFIG_SOUND is not set
# CONFIG_STM32_MDF_CORE is not set
# CONFIG_STM32_MDF_ADC is not set

# Wireless: Wi-Fi and Bluetooth (only on the optional M.2 card)
# CONFIG_WLAN is not set
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_BT is not set
# CONFIG_RFKILL is not set

# USB: the only USB port (CN10) is used for power only; network is Ethernet, console is CN2.
# Flashing over USB happens in the Boot ROM and U-Boot, so Linux does not need these drivers.
# CONFIG_USB_SUPPORT is not set
# CONFIG_PHY_STM32_USB2PHY is not set
# The ADC only measured the CC lines of CN10 to detect the charger's current (adc-usb-c-connector).
# CONFIG_STM32_ADC_CORE is not set
# CONFIG_STM32_ADC is not set
# CONFIG_IIO_RESCALE is not set
# CONFIG_IIO_STM32_TIMER_TRIGGER is not set
# CONFIG_IIO_STM32_LPTIMER_TRIGGER is not set

# Built in by Linux's generic arm64 defconfig, but not usable or not used on this product.
# Measured with initcall_debug: about 0.2 s of kernel boot in total.
# No PCIe on the STM32MP21 (DS14556 Rev 2): removes the PCI network card drivers (e1000, igb, hns3 ...)
# CONFIG_PCI is not set
# Network filesystems (NFS, 9P): the node does not mount disks over the network
# CONFIG_NFS_FS is not set
# CONFIG_SUNRPC is not set
# CONFIG_NET_9P is not set
# CONFIG_9P_FS is not set
# Running virtual machines (KVM, VFIO)
# CONFIG_VIRTUALIZATION is not set
# CONFIG_VFIO is not set
# Huge pages: a memory feature for large servers (also removes systemd's dev-hugepages.mount)
# CONFIG_HUGETLBFS is not set
# SD/MMC controllers of other vendors (this SoC uses MMC_STM32_SDMMC)
# CONFIG_MMC_SDHCI is not set
# CONFIG_MMC_DW is not set
# Disk quotas and the raw-flash filesystem JFFS2
# CONFIG_QUOTA is not set
# CONFIG_JFFS2_FS is not set
# Kept on purpose: loop and squashfs (RAUC bundles, phase 5), jitter entropy (randomness for crypto).

# UIO: ST uses it only for the firmware-update shared memory of the M33-TD boot setup
# (uio-fwu-shmem), which this board's device tree does not have. Its empty match entry becomes
# the alias of:N*T*C* (any device), so udev loaded it at every boot for nothing.
# CONFIG_UIO is not set

# Chip debug tracing and DDR performance counters: for chip debugging, not for the product
# CONFIG_CORESIGHT is not set
# CONFIG_STM is not set
# CONFIG_STM32_DDR_PMU is not set
# The debug bus (bus@4a000000) only gives access to the CoreSight blocks above and the HDP debug
# port (disabled in the device tree), so it has nothing left to serve.
# CONFIG_STM32_DBG_BUS is not set
